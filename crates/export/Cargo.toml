[package]
name = "reelwright-export"
description = "Export pipeline: parallel render → encode → mux, presets, progress/cancel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
reelwright-time = { workspace = true }
reelwright-frame = { workspace = true }
reelwright-color = { workspace = true }
reelwright-media = { workspace = true }
reelwright-project = { workspace = true }
reelwright-render = { workspace = true }
reelwright-audio-dsp = { workspace = true }
reelwright-geom = { workspace = true }
reelwright-text = { workspace = true }
reelwright-isobmff = { workspace = true }
reelwright-prores = { workspace = true }
reelwright-dnx = { workspace = true }
reelwright-apv = { workspace = true }
reelwright-mxf = { workspace = true }
reelwright-aac = { workspace = true }
reelwright-h264enc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
web-time = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp"] }

[dev-dependencies]
reelwright-testkit = { workspace = true }
reelwright-codecs = { workspace = true }
