[package]
name = "reelwright-codecs"
description = "Container + codec hub: MP4/MOV, Matroska, MXF, Ogg and MPEG TS/PS sources, image sequences, GOP-aware seeking, decoder registry, audio decoding"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
reelwright-time = { workspace = true }
reelwright-color = { workspace = true }
reelwright-frame = { workspace = true }
reelwright-media = { workspace = true }
reelwright-isobmff = { workspace = true }
reelwright-matroska = { workspace = true }
reelwright-mxf = { workspace = true }
reelwright-mpegts = { workspace = true }
reelwright-mpeg2v = { workspace = true }
reelwright-ac3 = { workspace = true }
reelwright-ogg = { workspace = true }
reelwright-bitstream = { workspace = true }
reelwright-h264 = { workspace = true }
reelwright-hevc = { workspace = true }
reelwright-vp9 = { workspace = true }
reelwright-prores = { workspace = true }
reelwright-dnx = { workspace = true }
reelwright-av1 = { workspace = true }
reelwright-apv = { workspace = true }
reelwright-aac = { workspace = true }
reelwright-opus = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
# Decode timing counters (`gop_stats`); std's Instant panics on wasm32.
web-time = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Bootstrap audio decoding (MPL-2.0, used unmodified); replaced by own decoders over time.
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "mp1", "mp2", "mp3", "flac", "alac", "pcm", "wav", "aiff", "ogg", "vorbis", "isomp4"] }

[dev-dependencies]
reelwright-testkit = { workspace = true }
