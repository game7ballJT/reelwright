[package]
name = "reelwright-engine"
description = "Reelwright engine façade: session, command registry, history, media pool"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
# Speech-to-text with Whisper (candle, CPU). Off by default and in wasm builds.
whisper = ["reelwright-speech/whisper"]
# Speech-model downloads over HTTPS.
speech-download = ["reelwright-speech/download"]

[dependencies]
reelwright-time = { workspace = true }
reelwright-geom = { workspace = true }
reelwright-color = { workspace = true }
reelwright-frame = { workspace = true }
reelwright-media = { workspace = true }
reelwright-codecs = { workspace = true }
reelwright-project = { workspace = true }
reelwright-edit = { workspace = true }
reelwright-render = { workspace = true }
reelwright-scopes = { workspace = true }
reelwright-text = { workspace = true }
reelwright-audio-dsp = { workspace = true }
reelwright-export = { workspace = true }
reelwright-mxf = { workspace = true }
reelwright-format = { workspace = true }
reelwright-interchange = { workspace = true }
reelwright-captions = { workspace = true }
reelwright-speech = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
web-time = "1"

[dev-dependencies]
reelwright-testkit = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
