[package]
name = "reelwright-golden"
description = "Golden-image tests for the CPU renderer/compositor and GPU-vs-CPU parity (test-only crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Test-only: the library is empty and everything is a dev-dependency, so the crate adds no edges
# to the layer graph. Goldens live in `goldens/` (see docs/testing.md §3).
[dependencies]

[dev-dependencies]
reelwright-testkit = { workspace = true }
reelwright-color = { workspace = true }
reelwright-frame = { workspace = true }
reelwright-time = { workspace = true }
reelwright-geom = { workspace = true }
reelwright-media = { workspace = true }
reelwright-project = { workspace = true }
reelwright-render = { workspace = true }
reelwright-gpu = { workspace = true }
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
