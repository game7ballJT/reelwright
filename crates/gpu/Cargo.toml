[package]
name = "reelwright-gpu"
description = "wgpu compositor: YUV/RGB layer sampling, linear-light premultiplied compositing in WGSL"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
reelwright-color = { workspace = true }
reelwright-frame = { workspace = true }
reelwright-geom = { workspace = true }
reelwright-render = { workspace = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"] }
log = { workspace = true }
rayon = { workspace = true }

[dev-dependencies]
pollster = "0.4"
wgpu = { version = "30", features = ["wgsl", "metal", "vulkan", "dx12", "gles"] }
reelwright-media = { workspace = true }
reelwright-project = { workspace = true }
reelwright-time = { workspace = true }
