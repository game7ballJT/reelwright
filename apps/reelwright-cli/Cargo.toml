[package]
name = "reelwright-cli"
description = "Reelwright headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "reelwright-cli"
path = "src/main.rs"

[features]
default = []
# Speech-to-text (Text panel ▸ Transcribe) with Whisper on the CPU, and model downloads.
whisper = ["reelwright-engine/whisper", "reelwright-engine/speech-download"]

[dependencies]
reelwright-engine = { workspace = true }
reelwright-media = { workspace = true }
reelwright-codecs = { workspace = true }
reelwright-platform = { workspace = true }
reelwright-mxf = { workspace = true }
reelwright-mpegts = { workspace = true }
reelwright-ogg = { workspace = true }
reelwright-time = { workspace = true }
reelwright-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
