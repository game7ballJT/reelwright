[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/game7ballJT/reelwright"

[workspace.dependencies]
# internal
reelwright-time = { path = "crates/time" }
reelwright-geom = { path = "crates/geom" }
reelwright-color = { path = "crates/color" }
reelwright-bitstream = { path = "crates/bitstream" }
reelwright-isobmff = { path = "crates/isobmff" }
reelwright-matroska = { path = "crates/matroska" }
reelwright-mxf = { path = "crates/mxf" }
reelwright-cfb = { path = "crates/cfb" }
reelwright-mpegts = { path = "crates/mpegts" }
reelwright-mpeg2v = { path = "crates/mpeg2v" }
reelwright-ac3 = { path = "crates/ac3" }
reelwright-ogg = { path = "crates/ogg" }
reelwright-h264 = { path = "crates/h264" }
reelwright-hevc = { path = "crates/hevc" }
reelwright-vp9 = { path = "crates/vp9" }
reelwright-prores = { path = "crates/prores" }
reelwright-dnx = { path = "crates/dnx" }
reelwright-apv = { path = "crates/apv" }
reelwright-av1 = { path = "crates/av1" }
reelwright-aac = { path = "crates/aac" }
reelwright-opus = { path = "crates/opus" }
reelwright-h264enc = { path = "crates/h264enc" }
reelwright-audio-dsp = { path = "crates/audio-dsp" }
reelwright-frame = { path = "crates/frame" }
reelwright-media = { path = "crates/media" }
reelwright-codecs = { path = "crates/codecs" }
reelwright-project = { path = "crates/project" }
reelwright-edit = { path = "crates/edit" }
reelwright-interchange = { path = "crates/interchange" }
reelwright-text = { path = "crates/text" }
reelwright-captions = { path = "crates/captions" }
reelwright-speech = { path = "crates/speech" }
reelwright-render = { path = "crates/render" }
reelwright-gpu = { path = "crates/gpu" }
reelwright-scopes = { path = "crates/scopes" }
reelwright-export = { path = "crates/export" }
reelwright-format = { path = "crates/format" }
reelwright-engine = { path = "crates/engine" }
reelwright-ui-egui = { path = "crates/ui-egui" }
reelwright-automation = { path = "crates/automation" }
reelwright-platform = { path = "crates/platform" }
reelwright-testkit = { path = "crates/testkit" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
rayon = "1"
proptest = "1"
roxmltree = "0.21"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

# Codec hot loops: debug-build tests (RFC/oracle vectors) are minutes slower below opt-level 3.
[profile.dev.package.reelwright-h264]
opt-level = 3

[profile.dev.package.reelwright-h264enc]
opt-level = 3

[profile.dev.package.reelwright-hevc]
opt-level = 3

[profile.dev.package.reelwright-prores]
opt-level = 3

[profile.dev.package.reelwright-dnx]
opt-level = 3

[profile.dev.package.reelwright-apv]
opt-level = 3

[profile.dev.package.reelwright-av1]
opt-level = 3

[profile.dev.package.reelwright-aac]
opt-level = 3

# Audio effects: realtime-factor tests and long convolution / spectral runs.
[profile.dev.package.reelwright-audio-dsp]
opt-level = 3

[profile.dev.package.reelwright-mxf]
opt-level = 3

[profile.dev.package.reelwright-opus]
opt-level = 3

[profile.dev.package.reelwright-vp9]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (`cargo xtask web`): small code everywhere (opt-level "s", fat LTO, no debug info),
# full speed in the codecs, compositor and audio DSP that run on the one browser thread.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

[profile.wasm-release.package.reelwright-h264]
opt-level = 3
[profile.wasm-release.package.reelwright-h264enc]
opt-level = 3
[profile.wasm-release.package.reelwright-render]
opt-level = 3
[profile.wasm-release.package.reelwright-frame]
opt-level = 3
[profile.wasm-release.package.reelwright-color]
opt-level = 3
[profile.wasm-release.package.reelwright-audio-dsp]
opt-level = 3
[profile.wasm-release.package.reelwright-aac]
opt-level = 3
